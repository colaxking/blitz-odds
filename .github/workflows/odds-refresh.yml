name: Blitz Odds - odds refresh

# Runs the odds refresh without Claude: pulls live NFL lines from
# SportsGameOdds (via the odds-proxy Netlify function), publishes them to
# the live site, and commits the on-disk mirror (data/odds-2026.json /
# data/odds-history.json) back to this repo.
#
# Cron below is in UTC. The old Claude-scheduled version ran hourly,
# 8am-11pm *local* time, Aug through Feb. 8am-11pm Eastern is roughly
# 12:00-04:00 UTC (the next day) during EDT (Mar-Nov) and 13:00-05:00 UTC
# during EST (Nov-Mar) - the schedule below uses the EST offset (13-23,0-5)
# as a safe year-round approximation; adjust if you want DST precision.
on:
  #schedule:
    #- cron: "0 13-23,0-5 * 7,8,9,10,11,12,1,2 *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: blitz-odds-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run odds refresh
        env:
          ODDS_UPDATE_SECRET: ${{ secrets.ODDS_UPDATE_SECRET }}
          # See hotpicks-snapshot.yml - GitHub Actions runners have flaky
          # IPv6 egress to Netlify that can cause ECONNRESET; force IPv4.
          NODE_OPTIONS: "--dns-result-order=ipv4first"
        run: node scripts/odds-refresh.mjs

      # always(): the refresh script writes the on-disk mirror before it
      # verifies the publish, so a late failure can still leave good data on
      # disk worth committing. If the run failed earlier than that there'll
      # simply be nothing to commit and this exits clean.
      - name: Commit on-disk mirror if changed
        if: always()
        run: |
          if git diff --quiet -- data/odds-2026.json data/odds-history.json; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "blitz-odds-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/odds-2026.json data/odds-history.json
          git commit -m "Odds refresh: automated update via GitHub Actions"
          git push
