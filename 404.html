<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Page not found | Blitz Odds</title>
<meta name="robots" content="noindex" />
<link rel="icon" type="image/svg+xml" href="/branding/blitz-odds-icon.svg" />
<meta name="theme-color" content="#0b1220" />
<!--
  Netlify serves this file, with a real 404 status, for any path that has no
  file and matches no rule in _redirects. It replaces the old
  `/games/* /index.html 200` and `/teams/* /index.html 200` fallbacks, which
  answered every missing matchup or team URL with the homepage and a 200 -
  a soft 404 that Search Console filed as duplicate content, thousands of
  times over.

  Standalone on purpose: no app bundle, no data seeds, no React. A 404 should
  cost nothing to serve and nothing to crawl.
-->
<script>
  (function () {
    try {
      var saved = localStorage.getItem("blitz-odds-theme");
      var mode = saved === "light" || saved === "dark" || saved === "system" ? saved : "system";
      var resolved = mode === "system"
        ? (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
        : mode;
      if (resolved === "light") document.documentElement.setAttribute("data-theme", "light");
    } catch (e) {}
  })();
</script>
<style>
  :root {
    --bg: #0b1220; --card-bg: #131c2e; --card-border: #223049;
    --text: #eef2f8; --text-dim: #9fb0c9; --accent: #4fd1c5;
  }
  :root[data-theme="light"] {
    --bg: #dbe2ec; --card-bg: #ffffff; --card-border: #c3cedd;
    --text: #16202f; --text-dim: #5b6b80; --accent: #0f9d91;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: 2rem 1rem;
  }
  main {
    width: 100%; max-width: 480px; text-align: center;
    background: var(--card-bg); border: 1px solid var(--card-border);
    border-radius: 14px; padding: 2rem 1.5rem;
  }
  .wordmark { height: 28px; width: auto; margin-bottom: 1.25rem; }
  :root[data-theme="light"] .wordmark-dark { display: none; }
  :root:not([data-theme="light"]) .wordmark-light { display: none; }
  h1 { font-size: 1.4rem; margin: 0 0 .5rem; }
  p { color: var(--text-dim); margin: 0 0 1.25rem; line-height: 1.5; }
  .links { display: flex; flex-wrap: wrap; gap: .6rem; justify-content: center; }
  .links a {
    display: inline-block; padding: .55rem .95rem; border-radius: 999px;
    border: 1px solid var(--card-border); color: var(--text); text-decoration: none;
    font-weight: 600; font-size: .92rem;
  }
  .links a.primary { background: var(--accent); border-color: var(--accent); color: #0b1220; }
</style>
</head>
<body>
<main>
  <a href="/" aria-label="Blitz Odds home">
    <img class="wordmark wordmark-dark" src="/branding/blitz-odds-wordmark-dark.svg" alt="Blitz Odds" />
    <img class="wordmark wordmark-light" src="/branding/blitz-odds-wordmark-light.svg" alt="Blitz Odds" />
  </a>
  <h1>That page doesn't exist</h1>
  <p>The matchup or team you're looking for may have moved weeks, or the link may be out of date. Everything on the schedule is one tap away.</p>
  <nav class="links" aria-label="Where to next">
    <a class="primary" href="/games">This week's games</a>
    <a href="/picks">Pick'em Playbook</a>
    <a href="/leagues">Leagues</a>
    <a href="/">Home</a>
  </nav>
</main>
</body>
</html>
