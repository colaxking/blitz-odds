<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Blitz Odds — Analytics</title>
<style>
  :root {
    --bg: #0b1220;
    --card-bg: #131c2e;
    --card-border: #223049;
    --accent: #4fd1c5;
    --accent-dim: #0f8f83;
    --text: #e7edf7;
    --text-dim: #8a95a8;
    --text-faint: #556077;
    --live: #ff3b30;
    --good: #6be3a1;
    --warn: #d9a02d;
    --blitz-orange: #fd7f01;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  body { padding: 20px 16px 60px; }
  .wrap { max-width: 1140px; margin: 0 auto; }

  header { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 10px 16px; margin-bottom: 18px; }
  header h1 { font-size: 1.35rem; margin: 0; letter-spacing: -0.01em; display: flex; align-items: center; gap: 10px; }
  header h1 span { color: var(--accent); }
  .brand-mark-icon { flex-shrink: 0; }
  .status-line { display: flex; align-items: center; gap: 10px; font-size: 0.78rem; color: var(--text-dim); flex-wrap: wrap; }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 3px rgba(107,227,161,0.15); }
  .status-dot.stale { background: var(--warn); box-shadow: 0 0 0 3px rgba(217,160,45,0.15); }
  .status-dot.error { background: var(--live); box-shadow: 0 0 0 3px rgba(255,59,48,0.15); }
  .btn {
    background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text);
    font-family: inherit; font-size: 0.78rem; padding: 5px 10px; border-radius: 7px; cursor: pointer;
  }
  .btn:hover { border-color: var(--accent-dim); }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .back-link { display:inline-block; margin-bottom:10px; font-size:.78rem; font-weight:700; color:var(--text-dim); text-decoration:none; }
  .back-link:hover, .back-link:focus-visible { color:var(--accent); }

  .global-range-row {
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px 12px; margin-bottom: 10px;
    background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 10px 14px;
  }
  .global-range-label { font-size: 0.78rem; font-weight: 600; }
  .global-range-sub { display: block; font-size: 0.68rem; font-weight: 400; color: var(--text-faint); margin-top: 1px; }
  .range-pills { display: flex; gap: 4px; background: #0d1526; border-radius: 8px; padding: 3px; flex-wrap: wrap; }
  .range-pill {
    background: none; border: none; color: var(--text-dim); font-family: inherit;
    font-size: 0.72rem; font-weight: 600; padding: 5px 10px; border-radius: 6px; cursor: pointer;
  }
  .range-pill:hover { color: var(--text); }
  .range-pill.active { background: var(--accent-dim); color: #fff; }

  .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 16px 0; }
  .kpi { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 14px 16px; }
  .kpi .label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-dim); margin-bottom: 6px; }
  .kpi .value { font-size: 1.55rem; font-weight: 650; letter-spacing: -0.01em; }
  .kpi .sub { font-size: 0.7rem; color: var(--text-faint); margin-top: 3px; }
  .kpi.clickable { cursor: pointer; }
  .kpi.clickable:hover { border-color: var(--accent-dim); }

  .section-nav {
    position: sticky; top: 0; z-index: 20; display: flex; gap: 6px; flex-wrap: wrap;
    background: rgba(11,18,32,0.92); backdrop-filter: blur(8px);
    padding: 10px 0 12px; margin-bottom: 4px; border-bottom: 1px solid var(--card-border);
  }
  .section-nav a {
    font-size: 0.72rem; font-weight: 600; color: var(--text-dim); text-decoration: none;
    padding: 5px 10px; border-radius: 999px; border: 1px solid var(--card-border); background: var(--card-bg);
  }
  .section-nav a:hover { color: var(--accent); border-color: var(--accent-dim); }

  .section { margin-top: 26px; scroll-margin-top: 60px; }
  .section-head {
    display: flex; align-items: center; gap: 10px; cursor: pointer; user-select: none;
    padding: 8px 0 10px; border-bottom: 1px solid var(--card-border); margin-bottom: 14px;
  }
  .section-chevron { color: var(--text-faint); font-size: 0.7rem; transition: transform 0.15s; width: 10px; }
  .section.collapsed .section-chevron { transform: rotate(-90deg); }
  .section-title { font-size: 0.95rem; font-weight: 650; letter-spacing: -0.01em; }
  .section-desc { font-size: 0.72rem; color: var(--text-faint); margin-left: 2px; }
  .section-count { margin-left: auto; font-size: 0.68rem; color: var(--text-faint); border: 1px solid var(--card-border); border-radius: 999px; padding: 2px 8px; }
  .section.collapsed .section-body { display: none; }

  /* Masonry via CSS columns: tile heights vary a lot, and a grid row sizes to
     its tallest member, which left large empty holes. */
  .section-body { column-count: 3; column-gap: 14px; }
  .section-body .card { break-inside: avoid; -webkit-column-break-inside: avoid; margin-bottom: 14px; display: inline-block; width: 100%; }
  @media (max-width: 980px) { .section-body { column-count: 2; } }
  @media (max-width: 680px) { .section-body { column-count: 1; } }

  .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .card h2 { font-size: 0.82rem; margin: 0 0 4px; color: var(--text); font-weight: 650; }
  .card .card-sub { font-size: 0.68rem; color: var(--text-faint); margin-bottom: 12px; line-height: 1.4; }
  .chart-wrap { position: relative; height: 220px; }
  #pvChart { cursor: pointer; }

  .bar-list { display: flex; flex-direction: column; gap: 9px; }
  /* Label column sizes to content and WRAPS rather than truncating - a fixed
     96px column was cutting off "Washington Commanders" and "Against the
     Spread". */
  .bar-row { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(52px, 1fr) 44px; align-items: center; gap: 9px; }
  .bar-row .bname { font-size: 0.78rem; white-space: normal; line-height: 1.25; overflow-wrap: break-word; }
  .bar-track { background: #0d1526; border-radius: 5px; height: 9px; overflow: hidden; }
  .bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent-dim), var(--accent)); border-radius: 5px; }
  .bar-row .bval { font-size: 0.76rem; color: var(--text-dim); text-align: right; font-variant-numeric: tabular-nums; }
  .bar-row.clickable { cursor: pointer; }
  .bar-row.clickable:hover .bname { color: var(--accent); }
  .bar-row.clickable:hover .bar-fill { filter: brightness(1.15); }

  /* Two-line variant for values that are long by nature (URL paths). */
  .bar-list.long { gap: 12px; }
  .bar-list.long .bar-row { display: block; }
  .bar-list.long .bname { white-space: normal; font-size: 0.78rem; font-weight: 600; line-height: 1.35; }
  .bar-list.long .bsub { font-size: 0.67rem; color: var(--text-faint); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar-list.long .brow-bottom { display: grid; grid-template-columns: 1fr 44px; align-items: center; gap: 9px; margin-top: 6px; }

  table.loc-table { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
  table.loc-table th { text-align: left; color: var(--text-faint); font-weight: 600; font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.04em; padding: 0 8px 8px 0; border-bottom: 1px solid var(--card-border); }
  table.loc-table td { padding: 7px 8px 7px 0; border-bottom: 1px solid #182238; }
  table.loc-table tr:last-child td { border-bottom: none; }
  table.loc-table td.num { text-align: right; color: var(--text-dim); }
  table.loc-table tr.clickable { cursor: pointer; }
  table.loc-table tr.clickable:hover td { color: var(--accent); }
  .empty { color: var(--text-faint); font-size: 0.78rem; padding: 4px 0; }

  /* Visitor explorer panel */
  #drillBackdrop { position: fixed; inset: 0; background: rgba(4,8,16,0.6); display: none; z-index: 40; }
  #drillBackdrop.open { display: block; }
  #drillPanel {
    position: fixed; right: 0; top: 0; bottom: 0; width: 100%; max-width: 520px;
    background: var(--card-bg); border-left: 1px solid var(--card-border);
    z-index: 41; transform: translateX(100%); transition: transform 0.18s ease-out;
    display: flex; flex-direction: column;
  }
  #drillPanel.open { transform: translateX(0); }
  .drill-head { padding: 16px; border-bottom: 1px solid var(--card-border); display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .drill-title { font-size: 0.95rem; font-weight: 650; }
  .drill-sub { font-size: 0.74rem; color: var(--text-dim); margin-top: 3px; line-height: 1.5; }
  .drill-close { background: none; border: 1px solid var(--card-border); color: var(--text-dim); width: 28px; height: 28px; border-radius: 7px; cursor: pointer; flex-shrink: 0; }
  .drill-back { background: none; border: none; color: var(--accent); font-family: inherit; font-size: 0.78rem; cursor: pointer; padding: 0; margin-bottom: 12px; }
  .drill-body { padding: 14px 16px; overflow-y: auto; flex: 1; }
  .drill-sort { display: flex; gap: 4px; background: #0d1526; border-radius: 8px; padding: 3px; margin-bottom: 12px; }
  .drill-sort button { flex: 1; background: none; border: none; color: var(--text-dim); font-family: inherit; font-size: 0.7rem; font-weight: 600; padding: 5px 8px; border-radius: 6px; cursor: pointer; }
  .drill-sort button.active { background: var(--accent-dim); color: #fff; }

  .session-row { padding: 11px 0; border-bottom: 1px solid #182238; cursor: pointer; display: flex; align-items: center; gap: 10px; }
  .session-row:last-child { border-bottom: none; }
  .session-row:hover .session-id { color: var(--accent); }
  .session-dev { font-size: 0.95rem; width: 20px; text-align: center; flex-shrink: 0; }
  .session-id { font-size: 0.8rem; font-weight: 600; font-family: ui-monospace, monospace; }
  .session-meta { font-size: 0.71rem; color: var(--text-dim); margin-top: 3px; }
  .session-depth { margin-left: auto; text-align: right; flex-shrink: 0; }
  .session-depth .n { font-size: 0.9rem; font-weight: 650; }
  .session-depth .l { font-size: 0.62rem; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.04em; }
  .session-badge { display: inline-block; font-size: 0.63rem; font-weight: 600; padding: 1px 6px; border-radius: 10px; margin-left: 6px; background: rgba(107,227,161,0.15); color: var(--good); }
  .session-badge.off, .session-badge.bounce { background: rgba(85,96,119,0.2); color: var(--text-faint); }

  .vs-summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 16px; }
  .vs-stat { background: #0d1526; border: 1px solid var(--card-border); border-radius: 9px; padding: 9px 10px; }
  .vs-stat .n { font-size: 1.05rem; font-weight: 650; }
  .vs-stat .l { font-size: 0.61rem; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.04em; margin-top: 2px; }
  .vs-prefs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
  .vs-chip { font-size: 0.68rem; color: var(--text-dim); background: #0d1526; border: 1px solid var(--card-border); border-radius: 999px; padding: 3px 9px; }

  .visit { border: 1px solid var(--card-border); border-radius: 11px; margin-bottom: 10px; overflow: hidden; }
  .visit-head { display: flex; align-items: center; gap: 9px; padding: 10px 12px; cursor: pointer; background: #0d1526; user-select: none; }
  .visit-chevron { color: var(--text-faint); font-size: 0.65rem; transition: transform 0.15s; width: 9px; flex-shrink: 0; }
  .visit.collapsed .visit-chevron { transform: rotate(-90deg); }
  .visit.collapsed .visit-body { display: none; }
  .visit-when { font-size: 0.78rem; font-weight: 600; }
  .visit-facts { font-size: 0.68rem; color: var(--text-faint); margin-top: 2px; }
  .visit-dur { margin-left: auto; font-size: 0.7rem; color: var(--text-dim); font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .visit-body { padding: 4px 12px 10px; }

  .tl-item { display: grid; grid-template-columns: 46px 1fr; gap: 8px; align-items: start; padding: 7px 0; border-bottom: 1px solid #182238; }
  .tl-item:last-child { border-bottom: none; }
  .tl-off { font-size: 0.66rem; color: var(--text-faint); font-variant-numeric: tabular-nums; padding-top: 2px; }
  .tl-label { font-size: 0.77rem; line-height: 1.4; }
  .tl-detail { font-size: 0.68rem; color: var(--text-faint); margin-top: 1px; word-break: break-word; }
  .tl-item.conversion .tl-label { color: var(--blitz-orange); font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
  <!-- Reached from the Analytics tab of the admin console, which opens it in
       a new tab - so "back" can't be history.back(). Plain link home. -->
  <a class="back-link" href="/">&#8592; Back to Blitz Odds</a>
  <header>
    <h1>
      <img class="brand-mark-icon" src="/branding/analytics-icon.png" width="30" height="30" alt="" aria-hidden="true" />
      Blitz <span>Odds</span> — Analytics
    </h1>
    <div class="status-line">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">Loading…</span>
      <button class="btn" id="visitorsBtn">Visitors</button>
      <button class="btn" id="refreshBtn">Refresh</button>
    </div>
  </header>

  <div class="global-range-row">
    <div class="global-range-label">Time range <span class="global-range-sub">applies to every tile below</span></div>
    <div class="range-pills" id="rangePills">
      <button class="range-pill" data-range="24h">24H</button>
      <button class="range-pill" data-range="7d">7D</button>
      <button class="range-pill active" data-range="30d">30D</button>
      <button class="range-pill" data-range="3m">3M</button>
      <button class="range-pill" data-range="6m">6M</button>
      <button class="range-pill" data-range="1y">1Y</button>
      <button class="range-pill" data-range="all">ALL</button>
    </div>
  </div>

  <div class="global-range-row">
    <div class="global-range-label">Traffic source <span class="global-range-sub" id="sourceSub">what counts as a real visit</span></div>
    <div class="range-pills" id="sourcePills">
      <button class="range-pill active" data-source="live">blitz-odds.com only</button>
      <button class="range-pill" data-source="live-nodc">Exclude datacenters</button>
      <button class="range-pill" data-source="all">Everything</button>
    </div>
  </div>

  <div class="kpi-row">
    <div class="kpi clickable" data-dimension="all" data-value="" data-label="All visitors">
      <div class="label">Unique visitors</div>
      <div class="value" id="kpiVisitors">—</div>
    </div>
    <div class="kpi clickable" data-dimension="all" data-value="" data-label="All visitors">
      <div class="label">Pageviews</div>
      <div class="value" id="kpiPageviews">—</div>
    </div>
    <div class="kpi">
      <div class="label">Pages / visitor</div>
      <div class="value" id="kpiPagesPer">—</div>
      <div class="sub" id="kpiPagesPerSub"></div>
    </div>
    <div class="kpi">
      <div class="label">Team pages</div>
      <div class="value" id="kpiTeamPageViews">—</div>
    </div>
    <div class="kpi">
      <div class="label">Game pages</div>
      <div class="value" id="kpiGamePageViews">—</div>
    </div>
    <div class="kpi" id="kpiTopLocCard">
      <div class="label">Top location</div>
      <div class="value" id="kpiTopLoc" style="font-size:1.02rem;">—</div>
    </div>
  </div>

  <div class="card">
    <h2>Pageviews over time</h2>
    <div class="card-sub">Tap a bar to see who visited in that bucket</div>
    <div class="chart-wrap"><canvas id="pvChart"></canvas></div>
  </div>

  <nav class="section-nav" id="sectionNav"></nav>
  <div id="sections"></div>
</div>

<div id="drillBackdrop"></div>
<div id="drillPanel">
  <div class="drill-head">
    <div>
      <div class="drill-title" id="drillTitle">—</div>
      <div class="drill-sub" id="drillSub"></div>
    </div>
    <button class="drill-close" id="drillClose" aria-label="Close">✕</button>
  </div>
  <div class="drill-body" id="drillBody"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js"></script>
<script>
(function () {
  "use strict";

  var ENDPOINT = "/.netlify/functions/analytics-summary";
  var SESSIONS_ENDPOINT = "/.netlify/functions/analytics-sessions";
  var REFRESH_MS = 60000;

  var pvChart = null, lastGoodFetch = null, latestData = null;
  var currentRange = "30d", currentSource = "live";
  // Per range+source payload cache. The server computes every range from one
  // scan, so switching ranges should never cost another round trip.
  var payloadCache = {};

  var TEAM_ABBRS = {"ARI": "Arizona Cardinals", "ATL": "Atlanta Falcons", "BAL": "Baltimore Ravens", "BUF": "Buffalo Bills", "CAR": "Carolina Panthers", "CHI": "Chicago Bears", "CIN": "Cincinnati Bengals", "CLE": "Cleveland Browns", "DAL": "Dallas Cowboys", "DEN": "Denver Broncos", "DET": "Detroit Lions", "GB": "Green Bay Packers", "HOU": "Houston Texans", "IND": "Indianapolis Colts", "JAX": "Jacksonville Jaguars", "KC": "Kansas City Chiefs", "LV": "Las Vegas Raiders", "LAC": "Los Angeles Chargers", "LAR": "Los Angeles Rams", "MIA": "Miami Dolphins", "MIN": "Minnesota Vikings", "NE": "New England Patriots", "NO": "New Orleans Saints", "NYG": "New York Giants", "NYJ": "New York Jets", "PHI": "Philadelphia Eagles", "PIT": "Pittsburgh Steelers", "SF": "San Francisco 49ers", "SEA": "Seattle Seahawks", "TB": "Tampa Bay Buccaneers", "TEN": "Tennessee Titans", "WAS": "Washington Commanders", "SD": "San Diego Chargers", "OAK": "Oakland Raiders", "STL": "St. Louis Rams", "WSH": "Washington Commanders", "LA": "Los Angeles Rams"};
  var TEAM_SLUGS = {"arizona-cardinals": "ARI", "atlanta-falcons": "ATL", "baltimore-ravens": "BAL", "buffalo-bills": "BUF", "carolina-panthers": "CAR", "chicago-bears": "CHI", "cincinnati-bengals": "CIN", "cleveland-browns": "CLE", "dallas-cowboys": "DAL", "denver-broncos": "DEN", "detroit-lions": "DET", "green-bay-packers": "GB", "houston-texans": "HOU", "indianapolis-colts": "IND", "jacksonville-jaguars": "JAX", "kansas-city-chiefs": "KC", "las-vegas-raiders": "LV", "los-angeles-chargers": "LAC", "los-angeles-rams": "LAR", "miami-dolphins": "MIA", "minnesota-vikings": "MIN", "new-england-patriots": "NE", "new-orleans-saints": "NO", "new-york-giants": "NYG", "new-york-jets": "NYJ", "philadelphia-eagles": "PHI", "pittsburgh-steelers": "PIT", "san-francisco-ers": "SF", "seattle-seahawks": "SEA", "tampa-bay-buccaneers": "TB", "tennessee-titans": "TEN", "washington-commanders": "WAS", "sd": "SD", "oak": "OAK", "stl": "STL", "wsh": "WSH", "la": "LA"};
  var BOOK_NAMES = { draftkings: "DraftKings", fanduel: "FanDuel", betmgm: "BetMGM", caesars: "Caesars", espnbet: "ESPN BET", bet365: "bet365" };

  function fmtNum(n) { return (typeof n === "number" ? n : 0).toLocaleString("en-US"); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function titleCase(s) { return String(s).charAt(0).toUpperCase() + String(s).slice(1); }
  function omitUnknown(o) { var out = {}; Object.keys(o || {}).forEach(function (k) { if (k !== "unknown") out[k] = o[k]; }); return out; }
  function relabel(o, map) { var out = {}; Object.keys(o || {}).forEach(function (k) { out[map[k] || titleCase(k)] = o[k]; }); return out; }

  function setStatus(state, text) {
    var dot = document.getElementById("statusDot");
    dot.className = "status-dot" + (state === "error" ? " error" : state === "stale" ? " stale" : "");
    document.getElementById("statusText").textContent = text;
  }

  // ---- Label prettifiers ------------------------------------------------
  function teamAbbr(slug) { return TEAM_SLUGS[slug] || slug.toUpperCase().slice(0, 4); }
  function titleSlug(s) { return String(s).split("-").map(function (w) { return w.charAt(0).toUpperCase() + w.slice(1); }).join(" "); }
  function weekLabel(s) {
    if (/^preseason-week-(\d+)$/.test(s)) return "Preseason Wk " + RegExp.$1;
    if (/^week-(\d+)$/.test(s)) return "Wk " + RegExp.$1;
    return titleSlug(s);
  }
  function matchupLabel(slug) {
    var m = String(slug).replace(/\.html$/, "").split("-at-");
    if (m.length !== 2) return titleSlug(String(slug).replace(/\.html$/, ""));
    return teamAbbr(m[0]) + " @ " + teamAbbr(m[1]);
  }
  function prettyPath(path) {
    var p = String(path);
    var parts = p.replace(/^\/|\/$/g, "").split("/");
    if (p === "/" || p === "") return { name: "Home — this week's games", sub: "/" };
    if (p === "/picks") return { name: "My Picks", sub: p };
    if (p === "/playbook") return { name: "Playbook", sub: p };
    if (p === "/leagues") return { name: "Leagues", sub: p };
    if (parts[0] === "teams" && parts[1]) return { name: titleSlug(parts[1]), sub: p };
    if (parts[0] === "games" && parts.length >= 4) return { name: matchupLabel(parts[3]), sub: weekLabel(parts[2]) + " " + parts[1] + " · game page" };
    if (parts[0] === "historical") {
      if (parts[1] === "index.html" || parts.length === 1) return { name: "Historical archive — index", sub: p };
      if (parts[1] === "teams" && parts[2]) return { name: titleSlug(parts[2]), sub: "archive team page" };
      if (parts.length >= 5) return { name: matchupLabel(parts[4]), sub: parts[1] + " · " + weekLabel(parts[3]) + " · archive" };
      return { name: "Historical archive", sub: p };
    }
    return { name: p, sub: "" };
  }
  // Returns an ARRAY: two paths can prettify to the same display name (a game
  // page and its archive page both read "PIT @ BUF"), and an object would
  // silently overwrite one count with the other. `raw` stays the untouched
  // pathname, which is what the drill-down has to filter on.
  function prettyPaths(dist) {
    return Object.entries(dist || {}).map(function (e) {
      var pp = prettyPath(e[0]);
      return { name: pp.name, sub: pp.sub, value: e[1], raw: e[0] };
    }).sort(function (a, b) { return b.value - a.value; });
  }
  function prettyReferrers(dist) {
    var out = {}, previews = 0;
    Object.keys(dist || {}).forEach(function (k) {
      if (/--blitz-odds\.netlify\.app$/.test(k)) { previews += dist[k]; return; }
      var name = k === "(direct)" ? "Direct / bookmark / app" : k === "(internal)" ? "Internal navigation" : k;
      out[name] = (out[name] || 0) + dist[k];
    });
    if (previews) out["Netlify deploy previews"] = previews;
    return Object.entries(out).sort(function (a, b) { return b[1] - a[1]; })
      .map(function (e) { return { name: e[0], sub: "", value: e[1], raw: e[0] }; });
  }
  // The store holds both "DEN" and "Denver Broncos" as separate keys for the
  // same team, so a team's real total was split across two bars.
  function normTeams(dist) {
    var out = {}, raw = {};
    Object.keys(dist || {}).forEach(function (k) {
      if (k === "unknown") return;
      var name = TEAM_ABBRS[k] || k;
      out[name] = (out[name] || 0) + dist[k];
      if (!raw[name]) raw[name] = k;
    });
    normTeams.raw = raw;
    return Object.fromEntries(Object.entries(out).sort(function (a, b) { return b[1] - a[1]; }));
  }
  function bookNames(dist) {
    var out = {};
    Object.keys(dist || {}).forEach(function (k) { out[BOOK_NAMES[k] || titleCase(k)] = dist[k]; });
    return out;
  }
  function shortCity(c) {
    var city = c.city || "", region = c.region || "", country = c.country || "";
    if (!city) return c.label || "Unknown";
    var parts = [city];
    if (region && region.toLowerCase().indexOf(city.toLowerCase()) === -1) parts.push(region);
    if (country) parts.push(country);
    return parts.join(", ");
  }
  function deviceObj(list) {
    var o = {};
    (list || []).forEach(function (d) { if (d.label !== "unknown") o[titleCase(d.label)] = d.uniqueVisitors; });
    return o;
  }
  // Say when a tile is incomplete rather than silently dropping the blanks,
  // which makes it look complete when it isn't.
  function unknownNote(dist, base) {
    var unknown = (dist || {}).unknown || 0;
    if (!unknown) return base;
    var total = Object.values(dist).reduce(function (a, b) { return a + b; }, 0);
    return base + " · " + unknown + " of " + total + " missing a team (tracking gap)";
  }

  /* Three numbers with one conclusion. Desyncs alone read as alarming and
     repairs alone read as fine; what matters is whether they match, so the
     tile states the unrepaired count in words rather than leaving it to be
     subtracted by eye. */
  function pushHealthHtml(d) {
    var desyncs = d.pushDesyncs || 0;
    var repairs = d.pushRepairs || 0;
    var failures = d.pushRepairFailures || 0;
    if (!desyncs && !repairs && !failures) {
      return '<div class="empty">No registration problems in this range</div>';
    }
    var verdict = failures > 0
      ? failures + (failures === 1 ? " device is" : " devices are") + " still unreachable"
      : "All detected desyncs were repaired automatically";
    return '<div style="font-size:1.7rem;font-weight:650;">' + fmtNum(desyncs) + "</div>" +
      '<div class="section-desc" style="margin-top:2px;">' +
      fmtNum(repairs) + " repaired \u00b7 " + fmtNum(failures) + " failed</div>" +
      '<div class="section-desc" style="margin-top:8px;color:' +
      (failures > 0 ? "var(--bad, #d33a3a)" : "inherit") + ';">' + esc(verdict) + "</div>";
  }

  /* Departures, as a funnel rather than a total. A raw "12 deleted" says
     nothing about whether the flow is working; starts-minus-completions is
     the number that separates "people looked and stayed" from "people tried
     and couldn't". Failures are called out in red because a failed deletion
     is a person who has asked to leave and is still here. */
  function accountDeleteHtml(d) {
    var starts = d.accountDeleteStarts || 0;
    var done = d.accountDeletes || 0;
    var failed = d.accountDeleteFailures || 0;
    var abandoned = d.accountDeleteAbandons || 0;
    if (!starts && !done && !failed) {
      return '<div class="empty">Nobody opened the delete panel in this range</div>';
    }
    var verdict = failed > 0
      ? failed + (failed === 1 ? " deletion failed" : " deletions failed") + " - these people asked to leave and couldn't"
      : abandoned > 0
        ? fmtNum(abandoned) + (abandoned === 1 ? " person opened it and stayed" : " people opened it and stayed")
        : "Every deletion that was started completed";
    return '<div style="font-size:1.7rem;font-weight:650;">' + fmtNum(done) + "</div>" +
      '<div class="section-desc" style="margin-top:2px;">' +
      fmtNum(starts) + " started \u00b7 " + fmtNum(abandoned) + " backed out \u00b7 " +
      fmtNum(failed) + " failed</div>" +
      '<div class="section-desc" style="margin-top:8px;color:' +
      (failed > 0 ? "var(--bad, #d33a3a)" : "inherit") + ';">' + esc(verdict) + "</div>";
  }

  /* The OAuth consent interstitial. The email form's checkbox needs no tile
     of its own - signup_checked sits next to signup_submit in the events
     list and the two move together. This one is different: it is a screen
     people can back out of, in front of a route where they have already
     decided to sign up. Stated as the drop rather than the accept count for
     the same reason as pushHealthHtml above. */
  function termsOauthHtml(d) {
    var prompts = d.termsOauthPrompts || 0;
    var accepted = d.termsOauthAccepted || 0;
    if (!prompts) return '<div class="empty">Nobody reached the OAuth consent step in this range</div>';
    var dropped = prompts - accepted;
    var rate = d.termsOauthAcceptRate;
    return '<div style="font-size:1.7rem;font-weight:650;">' + (rate === null ? "\u2014" : rate + "%") + "</div>" +
      '<div class="section-desc" style="margin-top:2px;">' +
      fmtNum(accepted) + " accepted of " + fmtNum(prompts) + " prompted</div>" +
      '<div class="section-desc" style="margin-top:8px;color:' +
      (dropped > 0 ? "var(--bad, #d33a3a)" : "inherit") + ';">' +
      esc(dropped > 0
        ? fmtNum(dropped) + (dropped === 1 ? " person backed out before Google" : " people backed out before Google")
        : "Everyone prompted accepted") + "</div>";
  }

  /* The blocking re-consent gate. Should be flat at zero in steady state -
     anything here means accounts are being stopped on the way in, either
     because the terms version was bumped, or because an OAuth round trip
     came back without consent recorded. Sign-outs are the ones that left. */
  function termsGateHtml(d) {

    return '<div style="font-size:1.7rem;font-weight:650;">' + fmtNum(shown) + "</div>" +
      '<div class="section-desc" style="margin-top:2px;">' +
      fmtNum(accepted) + " accepted \u00b7 " + fmtNum(signouts) + " signed out</div>" +
      '<div class="section-desc" style="margin-top:8px;color:' +
      (signouts > 0 ? "var(--bad, #d33a3a)" : "inherit") + ';">' +
      esc(signouts > 0
        ? fmtNum(signouts) + (signouts === 1 ? " account left rather than accept" : " accounts left rather than accept")
        : "Every account shown the gate accepted") + "</div>";
  }

  // ---- Rendering --------------------------------------------------------
  function barListHtml(data, dim, opts) {
    opts = opts || {};
    var rows = Array.isArray(data) ? data.slice(0, 8)
      : Object.entries(data || {}).slice(0, 8).map(function (e) { return { name: e[0], sub: "", value: e[1], raw: e[0] }; });
    if (!rows.length) return '<div class="empty">' + esc(opts.empty || "Nothing in this range yet") + "</div>";
    var max = Math.max.apply(null, rows.map(function (r) { return r.value; }));
    var cls = opts.long ? "bar-list long" : "bar-list";
    return '<div class="' + cls + '">' + rows.map(function (r) {
      var pct = max > 0 ? Math.max(4, Math.round((r.value / max) * 100)) : 0;
      var filterVal = opts.valueFn ? opts.valueFn(r.name, r) : (r.raw != null ? r.raw : r.name);
      var attrs = dim
        ? ' class="bar-row clickable" data-dimension="' + dim + '" data-value="' + esc(filterVal) + '" data-label="' + esc(r.name) + '"'
        : ' class="bar-row"';
      var bar = '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%"></div></div>';
      var val = '<div class="bval">' + fmtNum(r.value) + "</div>";
      if (opts.long) {
        var sub = r.sub ? '<div class="bsub" title="' + esc(r.sub) + '">' + esc(r.sub) + "</div>" : "";
        return "<div" + attrs + '><div class="bname">' + esc(r.name) + "</div>" + sub +
          '<div class="brow-bottom">' + bar + val + "</div></div>";
      }
      return "<div" + attrs + '><div class="bname">' + esc(r.name) + "</div>" + bar + val + "</div>";
    }).join("") + "</div>";

        { title: "Theme", sub: "Current setting per visitor", html: barListHtml(relabel(d.themeDistribution, {}), "theme", { valueFn: function (l) { return l.toLowerCase(); } }) },
        { title: "Sportsbook", sub: "Preferred odds source", html: barListHtml(bookNames(d.sportsbookDistribution), "sportsbook", { valueFn: function (l) { return l.toLowerCase(); } }) },
        { title: "Time zone", sub: "Auto (device) vs. an explicit pick", html: barListHtml(relabel(d.tzPrefDistribution, { auto: "Auto (device)" }), "tzPref", { valueFn: function (l) { return l === "Auto (device)" ? "auto" : l; } }) }
      ]}
    ];

  function renderSections(d) {
    var secs = sectionsFor(d);
    document.getElementById("sections").innerHTML = secs.map(function (s) {
      var collapsed = localStorage.getItem("blitz-analytics-sec-" + s.id) === "1";

  // ---- Chart ------------------------------------------------------------
  function fmtDayLabel(b) { return new Date(b + "T00:00:00Z").toLocaleDateString("en-US", { month: "short", day: "numeric" }); }
  function fmtHourLabel(b) { return new Date(b).toLocaleTimeString("en-US", { hour: "numeric" }); }
  function fmtMonthLabel(b) { return new Date(b + "-01T00:00:00Z").toLocaleDateString("en-US", { month: "short", year: "2-digit" }); }

  function seriesToChartInput(series) {
    var points = (series && series.points) || [];
    var g = (series && series.granularity) || "day";
    var labelFn = g === "hour" ? function (p, i) { return i % 3 === 0 ? fmtHourLabel(p.bucket) : ""; }
      : g === "month" ? function (p) { return fmtMonthLabel(p.bucket); }
      : function (p) { return fmtDayLabel(p.bucket); };
    return { type: g === "hour" ? "line" : "bar", labels: points.map(labelFn), values: points.map(function (p) { return p.count; }) };
  }
  function pvDimensionForGranularity(g) { return g === "hour" ? "pvHour" : g === "month" ? "pvMonth" : "pvDay"; }
  function pvBucketTitle(b, g) {
    if (g === "hour") return new Date(b).toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric" });
    if (g === "month") return fmtMonthLabel(b);
    return new Date(b + "T00:00:00Z").toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
  }
  function handlePvChartClick(evt, elements) {
    if (!elements || !elements.length || !latestData) return;
    var point = ((latestData.series && latestData.series.points) || [])[elements[0].index];
    if (!point || !point.count) return;
    var g = latestData.series.granularity;
    openList(pvDimensionForGranularity(g), point.bucket, "Visitors — " + pvBucketTitle(point.bucket, g));
  }
  function renderPvChart(data) {
    var series = seriesToChartInput(data.series);
    var ctx = document.getElementById("pvChart").getContext("2d");
    var isLine = series.type === "line";
    var dataset = isLine
      ? { data: series.values, borderColor: "#4fd1c5", backgroundColor: "rgba(79,209,197,0.12)", fill: true, tension: 0.3, pointRadius: 0, borderWidth: 2 }
      : { data: series.values, backgroundColor: "#0f8f83", borderRadius: 3, maxBarThickness: 26 };
    if (pvChart && pvChart.config.type === series.type) {
      pvChart.data.labels = series.labels;
      pvChart.data.datasets[0] = dataset;
      pvChart.update("none");
      return;
    }
    if (pvChart) { pvChart.destroy(); pvChart = null; }
    pvChart = new Chart(ctx, {
      type: series.type,
      data: { labels: series.labels, datasets: [dataset] },
      options: {
        responsive: true, maintainAspectRatio: false, onClick: handlePvChartClick,
        plugins: { legend: { display: false }, tooltip: { enabled: series.values.length > 0 } },
        scales: {
          x: { grid: { display: false }, ticks: { color: "#556077", maxRotation: 0, autoSkip: true, font: { size: 10 } } },
          y: { beginAtZero: true, grid: { color: "rgba(255,255,255,0.05)" }, ticks: { color: "#556077", precision: 0, font: { size: 10 } } }
        }
      }
    });
  }

  function render(data) {
    var pagesPer = data.uniqueVisitors ? data.totalPageviews / data.uniqueVisitors : 0;
    document.getElementById("kpiVisitors").textContent = fmtNum(data.uniqueVisitors);
    document.getElementById("kpiPageviews").textContent = fmtNum(data.totalPageviews);
    document.getElementById("kpiPagesPer").textContent = pagesPer.toFixed(2);
    document.getElementById("kpiPagesPerSub").textContent = pagesPer < 1.2 && data.uniqueVisitors > 50 ? "mostly single-page visits" : "";
    document.getElementById("kpiTeamPageViews").textContent = fmtNum(data.teamPageViews || 0);
    document.getElementById("kpiGamePageViews").textContent = fmtNum(data.gamePageViews || 0);
    document.getElementById("kpiTopLoc").textContent = data.topLocation || "—";
    var locCard = document.getElementById("kpiTopLocCard");
    if (data.topLocation) {
      locCard.classList.add("clickable");
      locCard.setAttribute("data-dimension", "city");
      locCard.setAttribute("data-value", data.topLocation);
      locCard.setAttribute("data-label", data.topLocation);
    } else {
      locCard.classList.remove("clickable");
      locCard.removeAttribute("data-dimension");
    }
    if (typeof data.excludedSessions === "number") {
      document.getElementById("sourceSub").textContent =
        data.excludedSessions > 0 ? fmtNum(data.excludedSessions) + " sessions excluded" : "what counts as a real visit";
    }
    try { if (window.Chart) renderPvChart(data); } catch (e) { /* charts are best-effort */ }
    renderSections(data);

  // ---- Visitor explorer -------------------------------------------------
  var backdrop = document.getElementById("drillBackdrop");
  var panel = document.getElementById("drillPanel");
  var dTitle = document.getElementById("drillTitle");
  var dSub = document.getElementById("drillSub");
  var dBody = document.getElementById("drillBody");
  var drillState = null, listSort = "recent";

  function closeDrill() { backdrop.classList.remove("open"); panel.classList.remove("open"); drillState = null; }
  backdrop.addEventListener("click", closeDrill);
  document.getElementById("drillClose").addEventListener("click", closeDrill);
  document.getElementById("visitorsBtn").addEventListener("click", function () { openList("all", "", "All visitors"); });

  function relTime(ts) {
    if (!ts) return "";
    var mins = Math.round((Date.now() - ts) / 60000);
    if (mins < 1) return "just now";
    if (mins < 60) return mins + "m ago";
    var hrs = Math.round(mins / 60);
    if (hrs < 24) return hrs + "h ago";
    return Math.round(hrs / 24) + "d ago";
  }
  function fmtDur(ms) {
    var s = Math.round((ms || 0) / 1000);
    if (s < 60) return s + "s";
    var m = Math.floor(s / 60);
    if (m < 60) return m + "m " + String(s % 60).padStart(2, "0") + "s";
    return Math.floor(m / 60) + "h " + (m % 60) + "m";
  }
  function offset(ms) {
    var s = Math.round(ms / 1000);
    return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  }
  function rangeLabel(r) {
    return ({ "24h": "last 24 hours", "7d": "last 7 days", "30d": "last 30 days", "3m": "last 3 months", "6m": "last 6 months", "1y": "last year", all: "all time" })[r] || r;
  }
  function devIcon(d) { return d === "mobile" ? "\uD83D\uDCF1" : d === "tablet" ? "\u25AD" : d === "desktop" ? "\uD83D\uDDA5" : "?"; }

  function openList(dimension, value, label) {
    drillState = { dimension: dimension, value: value, label: label };
    dTitle.textContent = label;
    dSub.textContent = "Loading visitors…";
    dBody.innerHTML = "";
    backdrop.classList.add("open");
    panel.classList.add("open");

    var url = SESSIONS_ENDPOINT + "?dimension=" + encodeURIComponent(dimension) +
      (dimension === "all" ? "" : "&value=" + encodeURIComponent(value)) +
      "&limit=50&range=" + encodeURIComponent(currentRange) +
      "&source=" + encodeURIComponent(currentSource) +
      "&sort=" + encodeURIComponent(listSort);

    fetch(url, { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (data) {
      if (!drillState || drillState.dimension !== dimension || drillState.value !== value) return;
      var sessions = (data && data.sessions) || [];
      var sortBar = dimension === "all"
        ? '<div class="drill-sort"><button data-sort="recent"' + (listSort === "recent" ? ' class="active"' : "") + ">Most recent</button>" +
          '<button data-sort="active"' + (listSort === "active" ? ' class="active"' : "") + ">Most active</button></div>"
        : "";
      if (!sessions.length) {
        dSub.textContent = "0 visitors";
        dBody.innerHTML = sortBar + '<div class="empty">No matching visitors in the current data.</div>';
        return;
      }
      dSub.textContent = fmtNum(sessions.length) + " visitor" + (sessions.length === 1 ? "" : "s") + " · " + rangeLabel(currentRange) +
        (data.truncated ? " (capped subset — there may be more)" : "");
      dBody.innerHTML = sortBar + sessions.map(function (s) {
        var badge = "";
        if (dimension === "favTeam" && typeof s.activeForFilter === "boolean") {
          badge = s.activeForFilter ? '<span class="session-badge">currently favorited</span>' : '<span class="session-badge off">unfavorited since</span>';
        } else if (s.eventCount <= 1) {
          badge = '<span class="session-badge bounce">bounced</span>';
        }
        return '<div class="session-row" data-id="' + esc(s.id) + '">' +
          '<div class="session-dev">' + devIcon(s.device) + "</div>" +
          '<div><div class="session-id">' + esc(s.visitorId) + badge + "</div>" +
          '<div class="session-meta">' + esc(s.city || s.country || "Unknown location") +
          " · " + fmtNum(s.visitCount || 0) + " visit" + (s.visitCount === 1 ? "" : "s") +
          " · last seen " + relTime(s.lastSeen) + "</div></div>" +
          '<div class="session-depth"><div class="n">' + fmtNum(s.eventCount) + '</div><div class="l">events</div></div></div>';
      }).join("");
    }).catch(function () {
      if (!drillState) return;
      dSub.textContent = "Couldn't load visitors";
      dBody.innerHTML = '<div class="empty">Something went wrong fetching this list.</div>';
    });
  }

  // Full label coverage for every type in track.mts's VALID_TYPES. The old
  // panel only handled six of them and fell through to the raw type string
  // for the rest.
  function eventLabel(ev) {
    var t = ev.type;
    var team = ev.teamName || ev.team;
    switch (t) {
      case "pageview": return { label: "Viewed " + (ev.page || "a page"), detail: [ev.pathname, ev.referrerHost && ev.referrerHost !== "(internal)" ? "from " + ev.referrerHost : null].filter(Boolean).join(" · ") };
      case "view_change": return { label: "Navigated to " + (ev.page || "another view"), detail: "in-app navigation" };
      case "team_click": return { label: "Clicked team " + team, detail: ev.origin === "favorites_bar" ? "from favorites bar" : "from game card" };
      case "favorite": return { label: (ev.adding ? "Favorited " : "Unfavorited ") + team, detail: "" };
      case "team_tab": return { label: 'Opened "' + ev.tab + '" tab', detail: ev.team || "" };
      case "roster_side": return { label: "Viewed " + ev.side + " depth chart", detail: ev.team || "" };
      case "player_view": return { label: "Viewed player " + ev.player, detail: ev.source ? String(ev.source).replace(/_/g, " ") : "" };
      case "news_click": return { label: "Clicked " + (ev.newsSource || "a") + " headline", detail: [ev.placement === "team_news" ? "Team News panel" : ev.placement === "ticker" ? "ticker" : null, ev.headline].filter(Boolean).join(" · ") };
      case "boxscore_click": return { label: "Opened box score — " + (ev.away || "?") + " @ " + (ev.home || "?"), detail: ev.source === "full_details" ? "from Full Details" : ev.source === "score_tap" ? "tapped the score" : "" };
      case "game_follow": return { label: (ev.adding ? "Followed game — " : "Unfollowed game — ") + (ev.away || "?") + " @ " + (ev.home || "?"), detail: [ev.week ? "week " + ev.week : null, ev.gameState === "live" || ev.gameState === "started" ? "mid-game" : null].filter(Boolean).join(" · ") };
      case "playbook_subtab": return { label: 'Opened Playbook — "' + ev.subtab + '"', detail: "" };
      case "playbook_format": return { label: "Switched pool format to " + ev.format, detail: "signed-out preview" };
      case "gate_cta": return { label: "Clicked gate CTA — " + (ev.action || "unknown"), detail: ev.surface === "pro" ? "Pro gate" : ev.surface === "signin" ? "Sign-in wall" : "", conversion: true };
      case "book_compare": return { label: "Opened sportsbook comparison", detail: "" };
      case "terms_consent": return (function () {
        var map = {
          signup_checked: ["Ticked the terms box", "signup form"],
          signup_unchecked: ["Un-ticked the terms box", "signup form"],
          oauth_prompt: ["Saw the terms consent dialog", "before Google"],
          oauth_accepted: ["Accepted the terms", "before Google"],
          oauth_declined: ["Dismissed the terms dialog", "OAuth abandoned"],
          gate_shown: ["Blocked by the terms gate", "has not accepted current terms"],
          gate_accepted: ["Accepted the terms", "blocking gate"],
          gate_signout: ["Signed out at the terms gate", "left rather than accept"],
          record_failed: ["Terms acceptance failed to save", "write error"]
        };
        var hit = map[ev.action] || ["Terms consent \u2014 " + (ev.action || "unknown"), ""];
        return { label: hit[0], detail: hit[1], conversion: ev.action === "oauth_accepted" || ev.action === "gate_accepted" };
      })();
      case "archive_entry": return { label: "Opened the archive", detail: ev.source === "menu" ? "from the account menu" : ev.source === "footer" ? "from the footer link" : "" };
      case "history_nav_click": return { label: "Archive — " + (ev.nav === "team" ? "team" : "season") + " navigation", detail: ev.page || "" };
      case "history_week_select": return { label: "Archive — filtered by " + (ev.filter || "week"), detail: ev.value || "" };
      case "history_game_click": return { label: "Archive — opened " + (ev.away || "?") + " @ " + (ev.home || "?"), detail: ev.page || "" };
      case "history_team_game_click": return { label: "Archive team page — opened " + (ev.away || "?") + " @ " + (ev.home || "?"), detail: ev.team || "" };
      default: return { label: String(t || "Event"), detail: "" };
    }
  }

  function openSessionDetail(id) {
    var back = drillState || { dimension: "all", value: "", label: "All visitors" };
    dTitle.textContent = "Loading…";
    dSub.textContent = "";
    dBody.innerHTML = "";

    fetch(SESSIONS_ENDPOINT + "?visitorId=" + encodeURIComponent(id), { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (!data || !data.ok || !data.session) {
          dTitle.textContent = "Visitor";
          dBody.innerHTML = '<div class="empty">Couldn\'t load this visitor.</div>';
          return;
        }
        var s = data.session;
        dTitle.textContent = "Visitor " + s.visitorId;
        dSub.textContent = (s.city || "Unknown location") + " · " + (s.device ? titleCase(s.device) : "Unknown device") +
          " · first seen " + relTime(s.firstSeen);

        var chips = [];
        if (s.theme) chips.push(titleCase(s.theme) + " theme");
        if (s.sportsbook) chips.push(BOOK_NAMES[s.sportsbook] || titleCase(s.sportsbook));
        if (s.tzPref) chips.push(s.tzPref === "auto" ? "Auto timezone" : s.tzPref);
        if (s.host) chips.push(s.host);
        (s.favoriteTeams || []).forEach(function (t) { chips.push("\u2605 " + (TEAM_ABBRS[t] || t)); });

        var visits = s.visits || [];
        var html = '<button class="drill-back" id="drillBackBtn">&#8592; Back to ' + esc(back.label) + "</button>" +
          '<div class="vs-summary">' +
          '<div class="vs-stat"><div class="n">' + fmtNum(s.visitCount || visits.length) + '</div><div class="l">Visits</div></div>' +
          '<div class="vs-stat"><div class="n">' + fmtNum(s.pageviews) + '</div><div class="l">Pages</div></div>' +
          '<div class="vs-stat"><div class="n">' + fmtNum(s.eventCount) + '</div><div class="l">Events</div></div>' +
          '<div class="vs-stat"><div class="n">' + fmtDur(s.totalActiveMs) + '</div><div class="l">Active</div></div></div>' +
          (chips.length ? '<div class="vs-prefs">' + chips.map(function (c) { return '<span class="vs-chip">' + esc(c) + "</span>"; }).join("") + "</div>" : "");

        html += visits.length ? visits.map(function (v, i) {
          var evs = (v.events || []).slice().sort(function (a, b) { return (a.ts || 0) - (b.ts || 0); });
          return '<div class="visit' + (i === 0 ? "" : " collapsed") + '">' +
            '<div class="visit-head"><span class="visit-chevron">&#9660;</span><div>' +
            '<div class="visit-when">' + esc(new Date(v.start).toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" })) + "</div>" +
            '<div class="visit-facts">' + fmtNum(v.pageviews) + " pages · " + fmtNum(evs.length) + " events" +
            (v.entryPage ? " · entry " + esc(v.entryPage) : "") + "</div></div>" +
            '<div class="visit-dur">' + fmtDur(v.durationMs) + "</div></div>" +
            '<div class="visit-body">' + evs.map(function (e) {
              var L = eventLabel(e);
              return '<div class="tl-item' + (L.conversion ? " conversion" : "") + '">' +
                '<div class="tl-off">+' + offset((e.ts || v.start) - v.start) + "</div><div>" +
                '<div class="tl-label">' + esc(L.label) + "</div>" +
                (L.detail ? '<div class="tl-detail">' + esc(L.detail) + "</div>" : "") + "</div></div>";
            }).join("") + "</div></div>";
        }).join("") : '<div class="empty">No recorded events.</div>';

        dBody.innerHTML = html;
        document.getElementById("drillBackBtn").addEventListener("click", function () {
          openList(back.dimension, back.value, back.label);
        });
      })
      .catch(function () { dBody.innerHTML = '<div class="empty">Something went wrong loading this visitor.</div>'; });
  }

  // ---- Delegated clicks -------------------------------------------------
  document.addEventListener("click", function (e) {

  // ---- Fetch ------------------------------------------------------------
  function cacheKey() { return currentRange + "|" + currentSource; }

  // A zeroed payload with the same shape the API returns, so a failed fetch
  // still renders the full page structure (sections, tiles, empty states)
  // instead of leaving a blank screen under an error line. Also what you see
  // if you open this file straight off disk, where the Netlify functions it
  // depends on obviously aren't reachable.
  function emptyPayload() {
    return {
      range: currentRange, totalPageviews: 0, uniqueVisitors: 0,
      series: { granularity: "day", points: [] },
      teamClicksByTeam: {}, favoritesByTeam: {}, topFavoriteTeam: null,
      rosterViewsByTeam: {}, depthChartSideViews: {}, topViewedPlayers: {},
      injuryPanelOpens: 0, injuryPanelOpenRate: null, injuryOpensByTeam: {}, scheduleGameClicksByTeam: {},
      newsSourceClicks: {}, newsClicksByPlacement: {}, teamClicksByOrigin: {},
      boxscoreClicksByTeam: {}, boxscoreClicksBySource: {},
      gameFollowAdds: 0, gameFollowRemoves: 0, gameFollowsByGame: {},
      gameFollowAddsInProgress: 0, gameFollowAddsScheduled: 0,
      playbookSubtabViews: {}, playbookFormatViews: {},
      gateCtaClicks: {}, gateCtaBySurface: {}, bookCompareOpens: 0,
      termsConsentActions: {}, termsSignupChecked: 0, termsOauthPrompts: 0, termsOauthAccepted: 0, termsOauthAcceptRate: null,
      termsGateShown: 0, termsGateAccepted: 0, termsGateSignouts: 0,
      pushDesyncs: 0, pushRepairs: 0, pushRepairFailures: 0,
      pushDesyncsByStage: {}, pushRepairFailuresByStage: {},
      historyPageviews: 0, historyGameClicksByTeam: {}, historyClicksByType: {},
      referrerBreakdown: {}, pageviewsByPath: {}, teamPageViews: 0, gamePageViews: 0,
      themeDistribution: {}, sportsbookDistribution: {}, tzPrefDistribution: {}, displayModeDistribution: {},
      viewsByCountry: [], viewsByCity: [], topLocation: null, viewsByDevice: [],
    };
  }

  function fetchAndRender(isManual) {
    var btn = document.getElementById("refreshBtn");
    if (isManual) btn.disabled = true;

    // Render whatever we already have for this range+source immediately, so
    // a range switch is instant rather than a blank wait on the network.
    var cached = payloadCache[cacheKey()];
    if (cached) { latestData = cached; render(cached); }
    setStatus(cached || lastGoodFetch ? "stale" : "loading", cached ? "Refreshing…" : "Loading…");

    var url = ENDPOINT + "?range=" + encodeURIComponent(currentRange) +
      "&source=" + encodeURIComponent(currentSource) + (isManual ? "&fresh=1" : "");
    var reqKey = cacheKey();

    fetch(url, { cache: "no-store" })
      .then(function (res) { if (!res.ok) throw new Error("HTTP " + res.status); return res.json(); })
      .then(function (data) {
        if (reqKey !== cacheKey()) return; // user switched while in flight
        payloadCache[reqKey] = data;
        latestData = data;
        render(data);
        lastGoodFetch = new Date();
        setStatus(data.stale ? "stale" : "ok", "Updated " + lastGoodFetch.toLocaleTimeString() +
          (data.stale ? " · cache is stale, recomputing shortly" : data.cached ? " · cached" : ""));
      })
      .catch(function (err) {
        if (reqKey !== cacheKey()) return;
        var isFileUrl = window.location.protocol === "file:";
        if (!latestData) render(emptyPayload());
        setStatus("error", isFileUrl
          ? "This page needs to run on blitz-odds.com — its data comes from Netlify Functions, which aren't reachable from a local file."
          : "Couldn't refresh (" + err.message + ")" +
            (lastGoodFetch ? " — showing last good data from " + lastGoodFetch.toLocaleTimeString() : ""));
      })
      .finally(function () { if (isManual) btn.disabled = false; });
  }

  document.getElementById("refreshBtn").addEventListener("click", function () { fetchAndRender(true); });

  document.getElementById("rangePills").addEventListener("click", function (e) {
    var btn = e.target.closest(".range-pill");
    if (!btn || btn.classList.contains("active")) return;
    document.querySelectorAll("#rangePills .range-pill").forEach(function (p) { p.classList.remove("active"); });
    btn.classList.add("active");
    currentRange = btn.getAttribute("data-range");
    closeDrill();
    fetchAndRender(false);
  });

  document.getElementById("sourcePills").addEventListener("click", function (e) {
    var btn = e.target.closest(".range-pill");
    if (!btn || btn.classList.contains("active")) return;
    document.querySelectorAll("#sourcePills .range-pill").forEach(function (p) { p.classList.remove("active"); });
    btn.classList.add("active");
    currentSource = btn.getAttribute("data-source");
    closeDrill();
    fetchAndRender(false);
  });

  // Only refetch on tab focus if what we're showing has actually gone stale.
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) return;
    if (lastGoodFetch && Date.now() - lastGoodFetch.getTime() < 30000) return;
    fetchAndRender(false);
  });

  fetchAndRender(false);
  setInterval(function () { if (!document.hidden) fetchAndRender(false); }, REFRESH_MS);
})();
</script>
</body>
</html>
