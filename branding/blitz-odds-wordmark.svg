<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 260">
  <defs>
    <linearGradient id="orangeArc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A1A"/>
      <stop offset="100%" stop-color="#FF5A1A"/>
    </linearGradient>
    <linearGradient id="tealCheck" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4C8"/>
      <stop offset="100%" stop-color="#0FB8AE"/>
    </linearGradient>
    <linearGradient id="ballGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#050A12"/>
    </linearGradient>
    <linearGradient id="tealText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4C8"/>
      <stop offset="100%" stop-color="#0FB8AE"/>
    </linearGradient>
  </defs>

  <!-- BLITZ text -->
  <text x="0" y="168" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="150"
        font-style="italic" fill="#FFFFFF" letter-spacing="-2">BLITZ</text>

  <!-- ICON (football + arc + check) -->
  <g transform="translate(400, 10) scale(1.05)">
    <path d="M 34 96
             C 44 54, 88 22, 138 20
             C 168 19, 186 30, 196 44
             C 178 34, 150 30, 122 40
             C 92 51, 66 74, 48 108
             C 43 100, 38 96, 34 96
             Z"
          fill="url(#orangeArc)"/>
    <path d="M 178 34 C 190 30, 200 32, 206 40 C 197 37, 187 38, 178 42 Z" fill="#FFFFFF"/>
    <g transform="rotate(-28 110 112)">
      <ellipse cx="110" cy="112" rx="74" ry="41" fill="url(#ballGrad)" stroke="#FFFFFF" stroke-width="4.5"/>
      <path d="M 64 112 Q 110 97 156 112" fill="none" stroke="#FFFFFF" stroke-width="3.5"/>
      <g stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round">
        <line x1="92" y1="101" x2="92" y2="122"/>
        <line x1="84" y1="106" x2="100" y2="106"/>
        <line x1="84" y1="112" x2="100" y2="112"/>
        <line x1="84" y1="118" x2="100" y2="118"/>
        <line x1="110" y1="99" x2="110" y2="121"/>
        <line x1="102" y1="104" x2="118" y2="104"/>
        <line x1="102" y1="111" x2="118" y2="111"/>
        <line x1="102" y1="118" x2="118" y2="118"/>
        <line x1="128" y1="101" x2="128" y2="123"/>
        <line x1="120" y1="107" x2="136" y2="107"/>
        <line x1="120" y1="113" x2="136" y2="113"/>
        <line x1="120" y1="119" x2="136" y2="119"/>
      </g>
    </g>
    <path d="M 90 154 L 118 180 L 190 92 L 170 82 L 116 146 L 102 134 Z" fill="url(#tealCheck)"/>
  </g>

  <!-- ODDS text -->
  <text x="655" y="168" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="150"
        font-style="italic" fill="url(#tealText)" letter-spacing="-2">ODDS</text>

  <!-- underline: orange line with chevron notch under the icon -->
  <path d="M 0 214
           L 460 214
           L 500 240
           L 540 214
           L 1220 214"
        fill="none" stroke="url(#orangeArc)" stroke-width="4" stroke-linejoin="round"/>
</svg>
